<div class="pagination">
    {% if page_obj.has_previous %}
        <a class="button" href="?page={{ page_obj.previous_page_number }}&per_page={{ page_obj.paginator.per_page }}">← Previous</a>
    {% endif %}

    <div class="page-number">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</div>

    {% if page_obj.has_next %}
        <a class="button" href="?page={{ page_obj.next_page_number }}&per_page={{ page_obj.paginator.per_page }}">Next →</a>
    {% endif %}
</div>
